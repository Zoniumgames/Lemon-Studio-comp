# Compila Lemon Studio únicamente para Windows de forma manual
name: CI - Solo Windows (Manual)

on:
  workflow_dispatch: # Esto permite activar la compilación manualmente con un botón desde GitHub

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # Los paquetes de plugins (VST3 + CLAP)
      - name: Bundle plugins
        run: cargo run -p bundle-plugins --locked

      # Todos los crates de la plataforma
      - name: Fetch
        run: cargo fetch --locked

      - name: Test
        run: cargo test --workspace --locked

      # Subir los archivos generados en Windows para poder descargarlos
      - name: Subir ejecutables y plugins como Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: LemonStudio-Windows
          path: |
            target/release/lemon*.exe
            target/debug/lemon*.exe
            target/bundled/
            target/artifacts/
          if-no-files-found: warn
